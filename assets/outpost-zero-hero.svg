<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-label="Outpost Zero: a five cycle survival trainer for a lunar south polar outpost">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04070D"/>
      <stop offset="0.62" stop-color="#081120"/>
      <stop offset="1" stop-color="#0B1B2E"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.38" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#F7FAF8"/>
      <stop offset="0.72" stop-color="#D9E4DE"/>
      <stop offset="1" stop-color="#B9C8C2"/>
    </radialGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DFF5EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#DFF5EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2236"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="520" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#CFE6DF">
    <circle cx="90" cy="120" r="2"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="86" r="1.5"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="140" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.7s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="92" r="1.4"><animate attributeName="opacity" values="0.8;0.25;0.8" dur="4.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="150" r="1.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1330" cy="90" r="1.6"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="3.9s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="210" r="1.3"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="196" r="1.2"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.1s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="1245" cy="180" r="1.3"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="4.9s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="300" r="1.4"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.6s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- header row -->
  <g>
    <circle cx="76" cy="58" r="17" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <circle cx="76" cy="58" r="4.5" fill="#2DD4BF"/>
    <text x="106" y="66" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="3" fill="#F4F7F5">OUTPOST ZERO</text>
    <text x="700" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2.5" fill="#8FA8B8">MISSION TRAINER</text>
    <g>
      <rect x="1002" y="38" width="382" height="40" rx="20" fill="none" stroke="#2DD4BF" stroke-width="1.5" opacity="0.75"/>
      <text x="1193" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" letter-spacing="2" fill="#2DD4BF">NASA SPACE APPS 2026 · TEAM APOAPSIS</text>
    </g>
    <line x1="56" y1="102" x2="1384" y2="102" stroke="#1D3A4F" stroke-width="1.5"/>
  </g>

  <!-- headline left -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="238" font-size="76" font-weight="800" fill="#F4F7F5">Keep the crew</text>
    <text x="56" y="322" font-size="76" font-weight="800" fill="#F4F7F5">alive<tspan fill="#2DD4BF">.</tspan></text>
    <text x="56" y="376" font-size="23" fill="#B9CBD6">A five cycle survival trainer for a lunar south polar outpost.</text>
    <text x="56" y="408" font-size="23" fill="#B9CBD6">Every decision spends a reserve the crew needs.</text>
    <g font-size="15.5" font-weight="700" letter-spacing="1.2">
      <rect x="56" y="440" width="128" height="38" rx="19" fill="#0E2236" stroke="#2DD4BF" stroke-width="1.2"/>
      <text x="120" y="465" text-anchor="middle" fill="#E8F2EE">5 CYCLES</text>
      <rect x="200" y="440" width="142" height="38" rx="19" fill="#0E2236" stroke="#2DD4BF" stroke-width="1.2"/>
      <text x="271" y="465" text-anchor="middle" fill="#E8F2EE">6 SYSTEMS</text>
      <rect x="358" y="440" width="216" height="38" rx="19" fill="#0E2236" stroke="#2DD4BF" stroke-width="1.2"/>
      <text x="466" y="465" text-anchor="middle" fill="#E8F2EE">REAL NASA SOURCES</text>
    </g>
  </g>

  <!-- scene right -->
  <g>
    <circle cx="1152" cy="212" r="150" fill="url(#moonglow)"/>
    <circle cx="1152" cy="212" r="98" fill="url(#moon)"/>
    <circle cx="1118" cy="178" r="15" fill="#C3D2CB" opacity="0.55"/>
    <circle cx="1184" cy="238" r="11" fill="#C3D2CB" opacity="0.45"/>
    <circle cx="1150" cy="262" r="7" fill="#C3D2CB" opacity="0.5"/>
    <circle cx="1206" cy="168" r="6" fill="#C3D2CB" opacity="0.4"/>

    <!-- descending capsule with speed streaks -->
    <g transform="translate(938,196)">
      <g stroke="#2DD4BF" stroke-width="4" stroke-linecap="round">
        <line x1="-64" y1="-26" x2="-30" y2="-26" opacity="0.75">
          <animate attributeName="opacity" values="0.15;0.85;0.15" dur="1.6s" repeatCount="indefinite"/>
        </line>
        <line x1="-78" y1="0" x2="-34" y2="0" opacity="0.5">
          <animate attributeName="opacity" values="0.85;0.15;0.85" dur="1.6s" repeatCount="indefinite"/>
        </line>
        <line x1="-62" y1="26" x2="-30" y2="26" opacity="0.65">
          <animate attributeName="opacity" values="0.15;0.85;0.15" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
        </line>
      </g>
      <g>
        <path d="M -30 -8 L -42 -13 L -42 13 L -30 8 Z" fill="#2DD4BF" opacity="0.9"/>
        <rect x="-32" y="-16" width="58" height="32" rx="16" fill="#D9E4DE"/>
        <circle cx="9" cy="0" r="7" fill="#0B1B2E" stroke="#2DD4BF" stroke-width="2.5"/>
        <rect x="-24" y="-16" width="7" height="32" fill="#B9C8C2" opacity="0.65"/>
      </g>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 -16; 0 14; 0 -16" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    </g>

    <!-- lunar surface -->
    <path d="M 640 520 L 640 452 Q 820 420 990 438 Q 1150 452 1290 436 Q 1380 428 1440 442 L 1440 520 Z" fill="url(#ground)"/>
    <ellipse cx="830" cy="486" rx="52" ry="7" fill="#081120" opacity="0.8"/>
    <ellipse cx="1330" cy="470" rx="38" ry="6" fill="#081120" opacity="0.8"/>

    <!-- outpost dome -->
    <g>
      <path d="M 1010 452 A 84 84 0 0 1 1178 452 Z" fill="#12293F" stroke="#2DD4BF" stroke-width="2"/>
      <path d="M 1036 452 A 58 58 0 0 1 1152 452" fill="none" stroke="#1D3A4F" stroke-width="2"/>
      <rect x="1082" y="424" width="24" height="28" rx="4" fill="#2DD4BF" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.55;0.9" dur="4.4s" repeatCount="indefinite"/>
      </rect>
      <!-- antenna and beacon -->
      <line x1="1094" y1="368" x2="1094" y2="330" stroke="#8FA8B8" stroke-width="3"/>
      <circle cx="1094" cy="324" r="5" fill="#2DD4BF"/>
      <circle cx="1094" cy="324" r="5" fill="none" stroke="#2DD4BF" stroke-width="2">
        <animate attributeName="r" values="5;26" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.85;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <!-- solar panel -->
      <g transform="translate(1246,420)">
        <line x1="0" y1="32" x2="0" y2="6" stroke="#8FA8B8" stroke-width="3"/>
        <g transform="rotate(-14)">
          <rect x="-52" y="-16" width="104" height="34" rx="4" fill="#0E2236" stroke="#2DD4BF" stroke-width="1.6"/>
          <line x1="-26" y1="-16" x2="-26" y2="18" stroke="#2DD4BF" stroke-width="1.2" opacity="0.7"/>
          <line x1="0" y1="-16" x2="0" y2="18" stroke="#2DD4BF" stroke-width="1.2" opacity="0.7"/>
          <line x1="26" y1="-16" x2="26" y2="18" stroke="#2DD4BF" stroke-width="1.2" opacity="0.7"/>
          <line x1="-52" y1="1" x2="52" y2="1" stroke="#2DD4BF" stroke-width="1.2" opacity="0.7"/>
        </g>
      </g>
      <!-- ground light pool -->
      <ellipse cx="1094" cy="456" rx="120" ry="9" fill="#2DD4BF" opacity="0.10"/>
    </g>
  </g>
</svg>
