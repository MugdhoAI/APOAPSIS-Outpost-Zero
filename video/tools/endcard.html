<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(900px 500px at 50% -10%, rgba(99, 222, 208, 0.16), transparent 70%),
          radial-gradient(700px 420px at 82% 110%, rgba(90, 150, 220, 0.14), transparent 70%),
          #07111f;
        font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        color: #e8f2fb;
      }
      .card {
        text-align: center;
        padding: 0 60px;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #9fb6c9;
      }
      .mark .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid #63ded0;
        box-shadow: 0 0 22px rgba(99, 222, 208, 0.5);
      }
      h1 {
        margin: 30px 0 18px;
        font-size: 82px;
        line-height: 1;
        letter-spacing: -0.02em;
        font-weight: 700;
      }
      .team {
        margin: 0;
        font-size: 22px;
        color: #c8d8e6;
      }
      .rule {
        width: 120px;
        height: 1px;
        margin: 34px auto 26px;
        background: linear-gradient(90deg, transparent, rgba(160, 200, 230, 0.55), transparent);
      }
      .note {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        color: #8fa6ba;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"><span class="dot"></span>NASA Space Apps Challenge 2026</div>
      <h1>Outpost Zero</h1>
      <p class="team">Team APOAPSIS · Build a Junior Astronaut Mission Trainer</p>
      <div class="rule"></div>
      <p class="note">
        Educational simulation for students. Resource values are game units,<br />
        not NASA engineering measurements. Not affiliated with NASA.
      </p>
    </div>
  </body>
</html>
